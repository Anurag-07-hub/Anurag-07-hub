<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Anurag-07-hub GitHub profile card</title>
  <desc id="desc">Light-themed ASCII style GitHub profile card for Anurag-07-hub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="420" fill="url(#bg)" rx="28"/>
  <rect x="32" y="32" width="1336" height="356" fill="url(#panel)" stroke="#cbd5e1" rx="24"/>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" fill="#0f172a">
    <text x="72" y="110" font-size="22" fill="#0f172a">Anurag-07-hub</text>
    <text x="72" y="145" font-size="18" fill="#475569">Mechanical Engineering Student</text>

    <text x="72" y="228" font-size="18" fill="#0f172a">   ___</text>
    <text x="72" y="250" font-size="18" fill="#0f172a">  / _ \_ __ ___</text>
    <text x="72" y="272" font-size="18" fill="#0f172a"> | | | | '_ ` _ \</text>
    <text x="72" y="294" font-size="18" fill="#0f172a"> | |_| | | | | | |</text>
    <text x="72" y="316" font-size="18" fill="#0f172a">  \___/|_| |_| |_|</text>

    <text x="520" y="150" font-size="26" fill="#0f172a">Robotics • Engineering • World of tech</text>
    <text x="520" y="190" font-size="22" fill="#0f172a">Learning:</text>
    <text x="520" y="222" font-size="22" fill="#1e293b">Arduino, C++, Embedded Systems, Web Dev</text>
    <text x="520" y="260" font-size="20" fill="#334155">Currently exploring creative solutions and practical builds</text>
    <text x="520" y="300" font-size="20" fill="#334155">Open to collaboration, learning, and meaningful projects</text>
  </g>

  <g transform="translate(1130 78)">
    <circle cx="72" cy="72" r="72" fill="#e2e8f0" stroke="#0f172a" stroke-width="4"/>
    <circle cx="72" cy="72" r="54" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <text x="72" y="82" text-anchor="middle" font-size="52" font-family="monospace" fill="#0f172a">A</text>
  </g>
</svg>
